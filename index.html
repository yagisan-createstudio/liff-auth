<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="page-title">NPS Viewer</title>
  <meta name="description" content="NPSレポートを閲覧できます。">
  <meta property="og:title" content="NPS Viewer">
  <meta property="og:description" content="NPSレポートを閲覧できます。">
  <!-- Warm up only public service connections; do not preload authenticated resources. -->
  <link rel="preconnect" href="https://static.line-scdn.net" crossorigin>
  <link rel="dns-prefetch" href="//script.google.com">
  <link rel="dns-prefetch" href="//script.googleusercontent.com">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body {
      background-color: #f7f7f4;
      color: #334155;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .app-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(15, 23, 42, 0.12);
      border-top: 3px solid #334155;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loader-text {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 16px;
    }
    .dots-bounce {
      display: inline-flex;
      margin-left: 2px;
      gap: 1.5px;
    }
    .dots-bounce span {
      display: inline-block;
      animation: dotBounce 1.4s infinite ease-in-out both;
      font-size: 14px;
      line-height: 1;
      color: inherit;
    }
    .dots-bounce span:nth-child(1) { animation-delay: -0.32s; }
    .dots-bounce span:nth-child(2) { animation-delay: -0.16s; }
    .dots-bounce span:nth-child(3) { animation-delay: 0s; }
    @keyframes dotBounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-4px); }
    }
    /* Archive closure: scoped full-page notice; viewer routing screen is unchanged. */
    .closure-notice { display:none; position:fixed; inset:0; z-index:10; overflow:auto; background:radial-gradient(ellipse at 12% 0%,#f6e9ed 0,transparent 52%),radial-gradient(ellipse at 100% 90%,#eeeaf2 0,transparent 45%),#f8f7f5; color:#30333b; -webkit-overflow-scrolling:touch; }
    .closure-shell { width:min(100% - 40px,520px); margin:0 auto; padding: max(38px,env(safe-area-inset-top)) 0 max(28px,env(safe-area-inset-bottom)); min-height:100%; display:flex; flex-direction:column; justify-content:center; }
    .closure-brand { display:flex; align-items:center; gap:10px; margin:0 0 24px 4px; font-size:12px; font-weight:650; letter-spacing:.07em; color:#73646d; }
    .closure-brand svg { width:25px; height:25px; color:#a15876; }
    .closure-card { background:rgba(255,255,255,.94); border:1px solid #fff; border-radius:28px; padding:36px 30px 30px; box-shadow:0 18px 60px -28px rgba(81,49,65,.22),0 1px 4px rgba(81,49,65,.03); }
    .closure-eyebrow { display:flex; align-items:center; gap:8px; color:#99617a; font-size:10px; font-weight:700; letter-spacing:.16em; margin-bottom:20px; }
    .closure-eyebrow::before { content:''; width:20px; height:1px; background:currentColor; }
    .closure-notice h1 { font-size:clamp(25px,6vw,32px); letter-spacing:-.045em; line-height:1.5; font-weight:700; margin:0 0 20px; }
    .closure-intro { font-size:14px; line-height:2; color:#6d6d77; text-wrap:pretty; }
    .closure-date { display:flex; align-items:center; justify-content:space-between; gap:12px; border-top:1px solid #eee9ec; border-bottom:1px solid #eee9ec; padding:17px 0; margin:27px 0 23px; }
    .closure-date dt { font-size:12px; color:#82747d; }
    .closure-date dd { font-size:14px; font-weight:600; letter-spacing:.02em; font-variant-numeric:tabular-nums; }
    .closure-thanks { font-size:14px; line-height:1.95; color:#55535d; margin-bottom:28px; }
    .closure-next { border-radius:18px; background:#f6f3f5; padding:20px; }
    .closure-next h2 { font-size:12px; font-weight:650; color:#866477; display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .closure-next svg { width:17px; height:17px; flex-shrink:0; }
    .closure-next p { font-size:13px; line-height:1.95; color:#77707a; }
    .closure-next strong { color:#4e4651; font-weight:650; }
    .closure-path { display:flex; align-items:center; gap:8px; margin-top:14px; font-size:12px; color:#66515f; font-weight:600; flex-wrap:wrap; }
    .closure-path span:last-child { padding:5px 10px; border:1px solid #e6dce2; border-radius:8px; background:#fff; }
    .closure-footer { text-align:center; color:#a299a0; font-size:10px; letter-spacing:.12em; margin-top:24px; }
    @media(max-width:360px) { .closure-shell { width:calc(100% - 28px); } .closure-card { padding:28px 23px 24px; } .closure-next { padding:17px; } }
    .err-msg {
      color: #ff3b30;
      font-size: 13px;
      margin-top: 14px;
      max-width: 80%;
      text-align: center;
      display: none;
      line-height: 1.4;
    }
    .production-diagnostic { position:fixed; right:10px; bottom:calc(10px + env(safe-area-inset-bottom,0px)); z-index:35; width:320px; max-width:calc(100vw - 20px); max-height:35vh; max-height:35dvh; overflow:auto; -webkit-overflow-scrolling:touch; padding:10px 12px; border:1px solid #cbd5e1; border-radius:12px; background:#f7f7f4; color:#334155; box-shadow:0 2px 12px #0002; font-size:11px; line-height:1.6; text-align:left; }
    .production-diagnostic[hidden] { display:none; }
    .production-diagnostic header { display:flex; align-items:center; justify-content:space-between; gap:8px; position:sticky; top:-10px; background:#f7f7f4; }
    .production-diagnostic button { min-width:44px; min-height:44px; border:1px solid #cbd5e1; border-radius:8px; background:white; color:#334155; font-size:12px; }
    .production-diagnostic p { margin-top:6px; }
    .production-diagnostic dt { margin-top:6px; }
    .production-diagnostic dd { font-weight:600; font-variant-numeric:tabular-nums; }
    .production-loader { position:fixed; inset:0; z-index:15; background:#ffe0e5; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .nps-archive-launch-hint { position:absolute; top:calc(20px + env(safe-area-inset-top,0px)); left:14px; right:14px; margin:auto; width:max-content; max-width:calc(100vw - 28px); border-radius:12px; padding:10px 15px; color:#8b1446; background:rgba(255,255,255,.62); border:1px solid rgba(255,255,255,.76); font:600 12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; text-align:center; font-variant-numeric:tabular-nums; }
    .nps-archive-info-toggle {
      position:absolute; top:calc(17px + env(safe-area-inset-top,0px)); right:14px;
      width:44px; height:44px; display:grid; place-items:center; z-index:1;
      border:0; background:transparent; color:#8b1446; cursor:pointer;
    }
    .nps-archive-info-toggle span {
      width:22px; height:22px; display:grid; place-items:center; border:1.5px solid currentColor;
      border-radius:50%; font-size:14px; font-weight:700; line-height:1;
    }
    .nps-archive-info-panel {
      position:absolute; top:calc(64px + env(safe-area-inset-top,0px)); right:14px; z-index:2;
      width:min(290px,calc(100% - 28px)); padding:14px; border:1px solid #edc9d4;
      border-radius:12px; background:#fff; color:#56263a; font-size:13px; line-height:1.55;
      box-shadow:0 6px 20px rgba(86,38,58,.12);
    }
    .nps-archive-info-panel[hidden] { display:none; }
    .nps-archive-info-panel p { margin-top:4px; }
    @media(max-width:380px) {
      .nps-archive-launch-hint { left:14px; right:62px; max-width:calc(100vw - 76px); }
    }
    .production-launch-mark {
      display: block;
      width: min(60vw, 225px);
      height: auto;
      flex-shrink: 0;
      color: #b80946;
    }
    .production-launch-mark .ink {
      fill: none;
      stroke: currentColor;
      stroke-width: 18;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform-box: fill-box;
      transform-origin: center;
      animation: production-launch-rise .42s cubic-bezier(.22,.8,.3,1) var(--delay) both;
    }
    .production-launch-mark .viewer-word .ink { stroke-width: 7.3; }
    @keyframes production-launch-rise {
      from { transform: translateY(9px) scale(.93); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .production-launch-mark .ink { animation: none; }
    }

    /* C-1 depth transition: production splash only */
    #production-loader .production-launch-mark,#production-loader .loader-text{transform-origin:center center}
    #production-loader.nps-c1-finish .production-launch-mark,
    #production-loader.nps-c1-finish .loader-text{animation:nps-c1-absorb .46s cubic-bezier(.64,.05,1,.55) forwards}
    #production-loader.nps-c1-finish{animation:nps-c1-backdrop .24s ease-in-out .36s forwards;pointer-events:none}
    @keyframes nps-c1-absorb{0%{transform:scale(1);opacity:1;filter:blur(0)}30%{transform:scale(1.045);opacity:1;filter:blur(0)}62%{transform:scale(.76);opacity:1;filter:blur(0)}100%{transform:scale(0);opacity:0;filter:blur(9px)}}
    @keyframes nps-c1-backdrop{to{opacity:0}}
    @media(prefers-reduced-motion:reduce){#production-loader.nps-c1-finish .production-launch-mark,#production-loader.nps-c1-finish .loader-text{animation:none;opacity:0}#production-loader.nps-c1-finish{animation-duration:.01ms}}
  </style>
</head>
<body>
  <div class="app-spinner" id="spinner"></div>
  <div class="loader-text" id="loader-box">
    <span id="status-text">起動中</span><span class="dots-bounce"><span>.</span><span>.</span><span>.</span></span>
  </div>
  <template id="nps-archive-info-template">
    <button type="button" class="nps-archive-info-toggle" aria-label="アーカイブ閲覧について"
      aria-controls="nps-archive-info-panel" aria-expanded="false"><span aria-hidden="true">i</span></button>
    <div id="nps-archive-info-panel" class="nps-archive-info-panel" hidden>
      <strong>アーカイブ閲覧について</strong>
      <p>アーカイブ閲覧モードでは、<br>レポートの表示に通常より時間が<br>かかる場合があります。</p>
      <p style="margin-top:1.55em">閲覧期限は、<br>配信メッセージに記載しています。</p>
    </div>
  </template>
  <template id="production-loader-template">
  <div class="production-loader" id="production-loader">
  <svg class="production-launch-mark" viewBox="0 0 274 167" role="img" aria-label="NPS Viewer"><path class="ink rise" style="--delay:0s" d="M 28,83 V 23 L 80,83 V 23"/>
<path class="ink rise" style="--delay:.25s" d="M 110,83 V 23 H 135 C 153,23 163,30 163,43 C 163,56 153,63 135,63 H 110"/>
<path class="ink rise" style="--delay:.50s" d="M 244,29 C 226,17 197,20 192,34 C 185,54 235,48 242,66 C 250,85 209,94 188,79"/><g class="viewer-word"><path class="ink rise" style="--delay:.50s" d="M 50,113 L 63,145 L 76,113"/>
<path class="ink rise" style="--delay:.40s" d="M 89,125 V 145 M 89,114 h .1"/>
<path class="ink rise" style="--delay:.30s" d="M 102,135 H 119 C 119,122 103,121 102,134 C 100,147 112,150 120,143"/>
<path class="ink rise" style="--delay:.20s" d="M 132,125 L 139,145 L 147,131 L 155,145 L 163,125"/>
<path class="ink rise" style="--delay:.10s" d="M 175,135 H 192 C 192,122 176,121 175,134 C 173,147 185,150 193,143"/>
<path class="ink rise" style="--delay:0s" d="M 207,145 V 125 M 207,135 C 210,128 215,125 223,125"/></g></svg>
  <div class="loader-text">
    <span id="nps-production-status">アプリを起動しています</span><span class="dots-bounce"><span>.</span><span>.</span><span>.</span></span>
  </div>
  </div>
  </template>
  <div class="err-msg" id="err-text"></div>
  <main class="closure-notice" id="closure-notice" aria-labelledby="closure-title">
    <div class="closure-shell">
      <div class="closure-brand">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="6" width="16" height="15" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M8 3h8M8 10h8M8 14h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>日次レポート · アーカイブ</span>
      </div>
      <article class="closure-card">
        <div class="closure-eyebrow">SERVICE CLOSED</div>
        <h1 id="closure-title">アーカイブ閲覧サイト<br>サービス終了のご案内</h1>
        <p class="closure-intro">アーカイブ閲覧サイトは、<br>2026年10月31日をもちまして、<br>サービスを終了いたしました。</p>
        <dl class="closure-date"><dt>サービス終了日</dt><dd><time datetime="2026-10-31">2026年10月31日</time></dd></dl>
        <p class="closure-thanks">これまでご利用いただき、<br>誠にありがとうございました。</p>
        <section class="closure-next" aria-labelledby="closure-next-title">
          <h2 id="closure-next-title"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/><path d="M12 11v6M12 7v.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>アカウント設定について</h2>
          <p>ID・パスワード・アイコンの変更は、<strong>NPS Viewerの「マイページ」</strong>から引き続き行えます。</p>
          <div class="closure-path"><span>NPS Viewer</span><span aria-hidden="true">›</span><span>マイページ</span></div>
        </section>
      </article>
      <footer class="closure-footer">日次レポート配信システム</footer>
    </div>
  </main>

  <script>
    const MY_LIFF_ID = '2011370236-GhC6I5kJ';

    // Temporarily use the same Apps Script as test Viewer A for the standard LIFF entry.
    const URL_TODAY_VIEWER = 'https://script.google.com/macros/s/AKfycbzlsw-2kV94RrMRiv1rE1sKTUiu7-0Cff4E5WSPZ3NfWdZE8WrLErjNZl4mGSkfWbE6/exec';
    const URL_TEST_VIEWER = 'https://script.google.com/macros/s/AKfycbyVFWDOot7UPJgwVaexYqTw_oNN1tvdIn7ILxSg7s3Myg3ES1QhPEuJRP2WzhSN_Jm3Ag/exec';
    const URL_ARCHIVE_SITE = 'https://script.google.com/macros/s/AKfycbzR6JqzhXRHTchBWn1VfRefOoNi1IWYJ2sYMhXeUtMbbrc065cpBCC9AQ37w7teKji7/exec';

    function getQueryParam(key) {
      const urlParams = new URLSearchParams(window.location.search);
      let val = urlParams.get(key);
      if (val) return val;

      const liffState = urlParams.get('liff.state');
      if (liffState) {
        const stateQueryIndex = liffState.indexOf('?');
        if (stateQueryIndex !== -1) {
          const stateParams = new URLSearchParams(liffState.substring(stateQueryIndex));
          val = stateParams.get(key);
          if (val) return val;
        }
      }

      if (window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        val = hashParams.get(key);
        if (val) return val;
      }

      return null;
    }

    // New archive viewer: date=YYYYMMDD. Keep legacy app=archive closure independent.
    const archiveDateRaw_ = String(getQueryParam('date') || '').trim();
    const hasArchiveDate_ = archiveDateRaw_ !== '';
    const archiveDateLooksValid_ = /^\d{8}$/.test(archiveDateRaw_);
    const archiveDateSafe_ = archiveDateLooksValid_ ? archiveDateRaw_ : 'invalid';
    const appType = getQueryParam('app');
    const isArchive = (appType === 'archive');

    function npsArchiveDateState_(date, now = new Date()) {
      if (!date) return 'normal';
      const match = /^(\d{4})(\d{2})(\d{2})$/.exec(date);
      if (!match) return 'rejected';
      const [, year, month, day] = match.map(Number);
      const target = new Date(Date.UTC(year, month - 1, day));
      if (target.getUTCFullYear() !== year || target.getUTCMonth() !== month - 1 ||
          target.getUTCDate() !== day) return 'rejected';

      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', hourCycle: 'h23'
      }).formatToParts(now);
      const tokyo = {};
      parts.forEach(part => { tokyo[part.type] = Number(part.value); });
      const today = Date.UTC(tokyo.year, tokyo.month - 1, tokyo.day);
      const elapsed = (today - target.getTime()) / 86400000;
      if (elapsed < 0 || elapsed >= 7) return 'rejected';
      return elapsed > 1 || (elapsed === 1 && tokyo.hour >= 15) ? 'archive' : 'normal';
    }

    // Reject dates before LIFF init. The server still enforces the viewing period.
    function npsArchiveEntryCheck_(dateState) {
      if (dateState !== 'rejected') return true;
      const spinner = document.getElementById('spinner');
      const loader = document.getElementById('loader-box');
      const error = document.getElementById('err-text');
      if (spinner) spinner.style.display = 'none';
      if (loader) loader.style.display = 'none';
      if (error) error.style.display = 'none';
      const notice = document.createElement('section');
      notice.id = 'nps-archive-expired-notice';
      notice.setAttribute('role', 'status');
      notice.style.cssText = 'width:min(100%,440px);padding:24px 16px;text-align:center;';
      const icon = document.createElement('span');
      icon.setAttribute('aria-hidden', 'true');
      icon.style.cssText = 'display:inline-grid;place-items:center;width:24px;height:24px;border:2px solid currentColor;border-radius:50%;color:#595959;font-size:15px;font-weight:700;line-height:1;margin-bottom:14px;';
      icon.textContent = 'i';
      const title = document.createElement('h1');
      title.textContent = 'アーカイブの閲覧期間外です';
      title.style.cssText = 'font-size:clamp(16px,5vw,22px);line-height:1.5;font-weight:700;color:#171717;margin:0 0 10px;';
      const description = document.createElement('p');
      description.textContent = 'このレポートは閲覧対象期間外です。\n閲覧可能な期間については、\n配信メッセージをご確認ください。';
      description.style.cssText = 'font-size:14px;line-height:1.85;color:#595959;white-space:pre-line;';
      notice.append(icon, title, description);
      document.body.appendChild(notice);
      document.title = 'アーカイブの閲覧期間外｜NPS Viewer';
      return false;
    }

    function showArchiveClosure() {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('loader-box').style.display = 'none';
      document.getElementById('err-text').style.display = 'none';
      document.getElementById('closure-notice').style.display = 'block';
      document.getElementById('page-title').innerText = 'サービス終了のご案内';
    }

    if (isArchive) {
      showArchiveClosure();
    } else {
      document.getElementById('status-text').innerText = 'リダイレクト中';
    }

    // This selects a destination, never grants Viewer permissions.
    function readTestLoginReturn_(){
      try {
        const state=new URLSearchParams(window.location.search).get('liff.state');
        if(!state||!/^\/?test\//.test(state))return null;
        const destination=new URL(state.replace(/^\//,''),'https://yagisan-createstudio.github.io/liff-auth/');
        if(destination.origin!=='https://yagisan-createstudio.github.io'||destination.pathname!=='/liff-auth/test/')return null;
        const viewer=destination.searchParams.get('viewer');
        if(viewer!=='TEST_A'&&viewer!=='TEST_B')return null;
        const safe=new URL('https://yagisan-createstudio.github.io/liff-auth/test/');
        safe.searchParams.set('viewer',viewer);
        const meal=destination.searchParams.get('meal');
        if(meal==='L'||meal==='D')safe.searchParams.set('meal',meal);
        const target=destination.searchParams.get('target');
        if(target)safe.searchParams.set('target',target);
        if(destination.searchParams.get('diagnostic')==='1')safe.searchParams.set('diagnostic','1');
        return safe.href;
      }catch(e){return null;}
    }
    const testLoginReturn_=readTestLoginReturn_();
    const productionCheck_ = getQueryParam('production') === '1';
    if (!isArchive) {
      const viewerConnection = document.createElement('link');
      viewerConnection.rel = 'preconnect';
      viewerConnection.href = 'https://script.google.com';
      document.head.appendChild(viewerConnection);
    }
    let npsViewerFrame_=null,npsLineCredential_='',npsPendingReceiver_=null,npsXWaitTimer_=null,npsXDiagnostic_=false;
    let npsProductionTiming_=null;
    let npsProductionStage_='';
    let npsProductionDiagnostic_=false,npsProductionDiagnosticClosed_=false;
    function npsProductionDiagnosticUpdate_(){
      if(!npsProductionDiagnostic_||npsProductionDiagnosticClosed_)return;
      try {
        let panel=document.getElementById('production-diagnostic');
        if(!panel){
          panel=document.createElement('aside');panel.id='production-diagnostic';panel.className='production-diagnostic';
          panel.setAttribute('aria-label','GitHub側の読み込み計測');
          const header=document.createElement('header');
          const title=document.createElement('strong');title.textContent='読み込み診断 · 検証Script A';header.append(title);
          const close=document.createElement('button');close.type='button';close.textContent='閉じる';
          close.addEventListener('click',function(){npsProductionDiagnosticClosed_=true;panel.remove();});
          header.append(close);panel.append(header);
          const stage=document.createElement('p');stage.id='production-diag-stage';stage.setAttribute('role','status');panel.append(stage);
          const list=document.createElement('dl');
          const labels=[
            ['liffInitMs','LIFF初期化：init呼び出し → 完了'],
            ['iframeAddedMs','iframe追加：このページの読み込み開始 → 要素追加直前'],
            ['iframeLoadMs','iframe load：要素追加直前 → 初回load'],
            ['iframeReadyMs','接続準備：要素追加直前 → 初回の検証済みready'],
            ['totalMs','入口経過：このページの読み込み開始 → 初回の検証済みready'],
            ['c1Reason','C1起動画面の終了理由']
          ];
          labels.forEach(function(row){
            const dt=document.createElement('dt');dt.textContent=row[1];list.append(dt);
            const dd=document.createElement('dd');dd.id='production-diag-'+row[0];list.append(dd);
          });
          panel.append(list);
          ['このページ単位の計測です。ログインでページが移ると計測はやり直します。',
           'readyは接続準備通知です。認証完了・PDF表示完了ではありません。',
           'イベントは前後・重複する場合があります。各時間は重なりがあり、合算できません。PDF表示完了時刻は入口では取得していません。'
          ].forEach(function(text){const p=document.createElement('p');p.textContent=text;panel.append(p);});
          document.body.append(panel);
        }
        const t=npsProductionTiming_;if(!t)return;
        document.getElementById('production-diag-stage').textContent=npsProductionStage_;
        const show=(name,end,start)=>{
          document.getElementById('production-diag-'+name).textContent=
            Number.isFinite(end)&&Number.isFinite(start)?Math.round(Math.max(0,end-start)*10)/10+' ms':'待機中／未計測';
        };
        show('liffInitMs',t.liffEnded,t.liffStarted);
        show('iframeAddedMs',t.iframeAdded,t.started);
        show('iframeLoadMs',t.iframeLoaded,t.iframeAdded);
        show('iframeReadyMs',t.ready,t.iframeAdded);
        show('totalMs',t.ready,t.started);
        document.getElementById('production-diag-c1Reason').textContent=t.c1Reason||'PDF通知を待機中';
      }catch(e){ /* Diagnostics must not interrupt authentication. No exception details are displayed or logged. */ }
    }
    function npsProductionSetStage_(stage){
      npsProductionStage_=stage;
      npsProductionDiagnosticUpdate_();
    }
    function npsProductionNow_(){
      try { const n=performance.now(); return Number.isFinite(n)?n:null; }
      catch(e) { return null; }
    }
    function npsXShowStatus_(text,small){
      let el=document.getElementById('nps-x-status');
      if(!el){el=document.createElement('div');el.id='nps-x-status';document.body.append(el);}
      el.textContent=text;
      el.style.cssText=small?'position:fixed;top:0;left:0;right:0;padding:8px;background:#f0edf8;color:#62537c;font:12px system-ui;text-align:center;z-index:20':'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;background:#f7f7f4;color:#334155;font:14px/1.8 system-ui;text-align:center;white-space:pre-line;z-index:20';
    }
    function npsReceiverBelongsToViewer_(source){
      if(!npsViewerFrame_||!source)return false;
      let w=source;
      try{for(let i=0;i<4;i++){if(w===npsViewerFrame_.contentWindow)return true;const next=w.parent;if(next===w)break;w=next;}}catch(e){}
      return false;
    }
    function npsSendCredential_(){
      const receiver=npsPendingReceiver_;
      if(!receiver||!npsReceiverBelongsToViewer_(receiver.source))return;
      receiver.source.postMessage({type:'nps-gateway-context-v2',challenge:receiver.challenge},receiver.origin);
      if(!npsLineCredential_)return;
      receiver.source.postMessage({type:'nps-line-credential-v2',challenge:receiver.challenge,accessToken:npsLineCredential_},receiver.origin);
    }
    let npsC1Completed_=false,npsC1PdfWaitTimer_=null;
    function npsC1FinishLoader_(reason){
      if(npsC1Completed_)return;
      npsC1Completed_=true;
      if(npsProductionTiming_){npsProductionTiming_.c1Reason=reason;npsProductionDiagnosticUpdate_();}
      clearTimeout(npsC1PdfWaitTimer_);
      npsC1PdfWaitTimer_=null;
      const loader=document.getElementById('production-loader');
      if(!loader)return;
      loader.classList.add('nps-c1-finish');
      setTimeout(function(){loader.remove();},680);
    }
    window.addEventListener('message',function(event){
      if(!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(event.origin)||!npsReceiverBelongsToViewer_(event.source))return;
      const m=event.data;
      const r=npsPendingReceiver_;
      if(!m||!r||event.source!==r.source||event.origin!==r.origin||m.challenge!==r.challenge)return;
      if(m.type==='nps-viewer-auth-check-v1'&&!npsC1Completed_){
        const label=document.getElementById('nps-production-status');
        if(label)label.textContent='アカウントの連携状態を確認中';
      }else if(m.type==='nps-viewer-initial-pdf-ready-v1'){
        npsC1FinishLoader_('PDF描画完了通知を受信');
      }else if(m.type==='nps-viewer-initial-pdf-error-v1'){
        // Never leave the user trapped behind the splash on a failed PDF request.
        npsC1FinishLoader_('PDFエラー通知を受信');
      }
    });
    window.addEventListener('message',function(event){
      if(!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(event.origin)||!npsReceiverBelongsToViewer_(event.source))return;
      const m=event.data;if(!m||m.type!=='nps-viewer-ready-v2'||!/^[a-f0-9]{64}$/.test(m.challenge||''))return;
      if(npsXWaitTimer_){clearTimeout(npsXWaitTimer_);npsXWaitTimer_=null;}
      const first=!npsPendingReceiver_;
      npsPendingReceiver_={source:event.source,origin:event.origin,challenge:m.challenge};
      if(first){
        // Reveal the Viewer if its initial PDF notification never arrives.
        if(document.getElementById('production-loader')){
          npsC1PdfWaitTimer_=setTimeout(()=>npsC1FinishLoader_('接続準備から20秒以内にPDF通知なし'),20000);
        }
        if(npsXDiagnostic_)npsXShowStatus_('Xの画面との接続を確認しました（LINE認証は未実施）',true);
        else {const status=document.getElementById('nps-x-status');if(status)status.remove();}
      }
      npsSendCredential_();
      if (first && npsProductionTiming_) {
        npsProductionTiming_.ready = npsProductionNow_();
        npsProductionSetStage_('ビューアーへの接続準備完了');
      }
    });
    async function npsOpenViewerX_(){
      try{
        npsXDiagnostic_=getQueryParam('diagnostic')==='1';
        npsXShowStatus_(npsXDiagnostic_?'Xの画面接続を確認しています…\nこの確認ではLINE認証を実行しません。':'LINEのログイン状態を確認しています…',false);
        if(!npsXDiagnostic_){
          await liff.init({liffId:MY_LIFF_ID});
          if(!liff.isLoggedIn()){liff.login();return;}
          npsLineCredential_=liff.getAccessToken();if(!npsLineCredential_)throw new Error('LINEから開き直してください');
          npsXShowStatus_('ビューアーXを読み込んでいます…',false);
        }
        const url=new URL(URL_TEST_VIEWER),meal=String(getQueryParam('meal')||'').toUpperCase();
        if(meal==='L'||meal==='D')url.searchParams.set('meal',meal);
        npsViewerFrame_=document.createElement('iframe');npsViewerFrame_.title='Viewer X 検証用';
        npsViewerFrame_.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;background:white;z-index:5';
        npsViewerFrame_.referrerPolicy='no-referrer';npsViewerFrame_.allow='camera; fullscreen';npsViewerFrame_.src=url.href;
        document.body.append(npsViewerFrame_);
        npsXWaitTimer_=setTimeout(function(){
          if(npsPendingReceiver_)return;
          npsXShowStatus_('Xの画面との接続を確認できませんでした。\nA/Bの閲覧には影響しません。\nこの画面を閉じてLINEから開き直してください。\n確認コード：X_FRAME_READY_TIMEOUT',false);
        },45000);
      }catch(error){
        npsLineCredential_='';if(npsViewerFrame_)npsViewerFrame_.remove();npsViewerFrame_=null;
        npsXShowStatus_(error&&error.message||'検証画面を開けませんでした',false);
      }
    }
    async function main() {
      const dateState = npsArchiveDateState_(archiveDateRaw_);
      if (!npsArchiveEntryCheck_(dateState)) return;
      if(!isArchive&&String(getQueryParam('viewer')||'').trim().toUpperCase()==='X')return npsOpenViewerX_();
      // Archive entry is closed before authentication, profile access or navigation.
      if (isArchive) { showArchiveClosure(); return; }
      if(testLoginReturn_){
        try {
          // Let the SDK consume its authentication parameters before changing URL.
          await liff.init({liffId:MY_LIFF_ID});
          window.location.replace(testLoginReturn_);
        }catch(e){
          document.getElementById('spinner').style.display='none';
          document.getElementById('loader-box').style.display='none';
          const error=document.getElementById('err-text');
          error.innerText='検証用ページの認証復帰に失敗しました。検証用URLから開き直してください。';
          error.style.display='block';
        }
        return;
      }
      await npsOpenProduction_(dateState);
    }

    async function npsOpenProduction_(dateState) {
      const loader = document.getElementById('production-loader-template');
      document.body.append(loader.content.cloneNode(true));
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('loader-box').style.display = 'none';
      document.title = dateState === 'archive' ? 'NPS Viewer | Archive Mode' : 'NPS Viewer';
      if (dateState === 'archive') {
        const launchScreen = document.getElementById('production-loader');
        const info = document.getElementById('nps-archive-info-template').content.cloneNode(true);
        const button = info.querySelector('button');
        const panel = info.querySelector('.nps-archive-info-panel');
        const setOpen = open => {
          panel.hidden = !open;
          button.setAttribute('aria-expanded', String(open));
        };
        button.addEventListener('click', () => setOpen(panel.hidden));
        launchScreen.addEventListener('click', event => {
          if (!button.contains(event.target) && !panel.contains(event.target)) setOpen(false);
        });
        launchScreen.addEventListener('keydown', event => {
          if (event.key === 'Escape' && !panel.hidden) {
            setOpen(false);
            button.focus();
          }
        });
        launchScreen.prepend(info);
        const label = document.createElement('div');
        label.className = 'nps-archive-launch-hint';
        const formattedDate = archiveDateRaw_.replace(/^(\d{4})(\d{2})(\d{2})$/, '$1/$2/$3');
        label.textContent = 'アーカイブ閲覧モード · ' + formattedDate;
        launchScreen.prepend(label);
        const status = document.getElementById('nps-production-status');
        if (status) status.textContent = '過去のレポートを開いています';
      }
      npsProductionDiagnostic_ = getQueryParam('diagnostic') === '1';
      if (npsProductionDiagnostic_) npsProductionTiming_ = {started:0};
      npsProductionSetStage_('LIFFを初期化中');
      let failureMessage='LINEの初期化が完了しませんでした。';
      try {
        if (npsProductionTiming_) npsProductionTiming_.liffStarted = npsProductionNow_();
        let initTimer;
        try {
          await Promise.race([
            liff.init({liffId:MY_LIFF_ID}),
            new Promise((_,reject)=>{initTimer=setTimeout(()=>reject(new Error('LIFF_INIT_TIMEOUT')),20000);})
          ]);
        }finally{
          clearTimeout(initTimer);
        }
        if (npsProductionTiming_) npsProductionTiming_.liffEnded = npsProductionNow_();
        failureMessage='LINE認証を完了できませんでした。';
        npsProductionSetStage_('LINEのログイン状態を確認中');

        const meal = String(getQueryParam('meal') || '').toUpperCase();
        const target = getQueryParam('target');
        const loginKey = 'nps-production-entry-login-v1';
        if (!liff.isLoggedIn()) {
          const previous = Number(sessionStorage.getItem(loginKey) || 0);
          if (previous && Date.now() - previous < 300000) throw new Error('LINEログインを完了できませんでした。5分後に開き直してください。');
          const returnUrl = new URL('https://yagisan-createstudio.github.io/liff-auth/');
          if (productionCheck_) returnUrl.searchParams.set('production','1');
          if (npsProductionDiagnostic_) returnUrl.searchParams.set('diagnostic','1');
          if (meal === 'L' || meal === 'D') returnUrl.searchParams.set('meal',meal);
          if (target) returnUrl.searchParams.set('target',target);
          if (hasArchiveDate_) returnUrl.searchParams.set('date',archiveDateSafe_);
          sessionStorage.setItem(loginKey,String(Date.now()));
          npsProductionSetStage_('LINEログインへ移動中');
          liff.login({redirectUri:returnUrl.href});
          return;
        }
        try { sessionStorage.removeItem(loginKey); } catch (e) {}
        const credential = liff.getAccessToken();
        if (!credential) throw new Error('LINE認証情報を取得できませんでした。LINEから開き直してください。');
        npsLineCredential_ = credential;
        failureMessage='ビューアーを開けませんでした。';

        const url = new URL(URL_TODAY_VIEWER);
        if (meal === 'L' || meal === 'D') url.searchParams.set('meal',meal);
        if (target) url.searchParams.set('target',target);
        if (hasArchiveDate_) url.searchParams.set('date',archiveDateSafe_);
        npsViewerFrame_ = document.createElement('iframe');
        npsViewerFrame_.title = 'NPS Viewer';
        npsViewerFrame_.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;background:white;z-index:5';
        npsViewerFrame_.referrerPolicy = 'no-referrer';
        npsViewerFrame_.allow = 'camera; fullscreen';
        npsViewerFrame_.src = url.href;
        if (npsProductionTiming_) {
          npsViewerFrame_.addEventListener('load',function(){
            npsProductionTiming_.iframeLoaded = npsProductionNow_();
            if (npsPendingReceiver_) npsProductionDiagnosticUpdate_();
            else npsProductionSetStage_('ビューアーの接続準備通知を待機中');
          },{once:true});
          npsProductionTiming_.iframeAdded = npsProductionNow_();
        }
        npsProductionSetStage_('ビューアーを読み込み中');
        const startupLabel=document.getElementById('nps-production-status');
        if(startupLabel)startupLabel.textContent='ビューアーを読み込んでいます';
        document.body.append(npsViewerFrame_);
        npsXWaitTimer_ = setTimeout(function(){
          if (npsPendingReceiver_) return;
          npsProductionError_('ビューアーから接続準備の通知が届きませんでした。');
        },45000);
      }catch(error){
        npsProductionError_(failureMessage);
      }
    }

    function npsProductionError_(message){
      clearTimeout(npsC1PdfWaitTimer_);
      npsC1PdfWaitTimer_=null;
      document.getElementById('production-loader')?.remove();
      npsLineCredential_='';
      if (npsViewerFrame_) npsViewerFrame_.remove();
      npsViewerFrame_=null;
      npsProductionSetStage_(message);
      npsXShowStatus_(message+'\nLINEから開き直してください。',false);
    }
    // Begin as soon as the DOM is ready; do not wait for images and other subresources.
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', main, {once:true});
    } else {
      main();
    }

  </script>
</body>
</html>
