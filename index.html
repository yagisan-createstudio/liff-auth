<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン中...</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      margin: 0; padding: 0; background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      height: 100vh; overflow: hidden;
    }
    .spinner {
      width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2);
      border-top: 3px solid #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .msg { font-size: 14px; font-weight: 600; color: #ccc; letter-spacing: 0.5px; }
    .err-msg { color: #ff6b6b; font-size: 12px; margin-top: 15px; max-width: 80%; text-align: center; display: none; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="msg" id="status-text">LINE認証中...</div>
  <div class="err-msg" id="err-text"></div>

  <script>
    // ★ LINE DevelopersでLIFF作成後に取得できるIDに後ほど書き換えます
    const MY_LIFF_ID = '2011370236-GhC6l5kJ';
    
    // ★ 単日ビューアーのGASデプロイURL
    const GAS_VIEWER_URL = 'https://script.google.com/macros/s/AKfycbx7ZVIc7yvOJMQAqDzTOhMTHW819eZkpKvQaawaW4JhaDvNzuxDOEGnCnp5eNiHQDfp/exec';

    window.onload = function() {
      main();
    };

    async function main() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        document.getElementById('status-text').innerText = 'アカウント照合中...';
        const profile = await liff.getProfile();
        const lineUserId = profile.userId;

        const redirectUrl = GAS_VIEWER_URL + (GAS_VIEWER_URL.includes('?') ? '&' : '?') + 'line_uid=' + encodeURIComponent(lineUserId);
        window.location.replace(redirectUrl);

      } catch (err) {
        document.getElementById('status-text').innerText = '認証に失敗しました';
        const errEl = document.getElementById('err-text');
        errEl.innerText = err.message || JSON.stringify(err);
        errEl.style.display = 'block';
      }
    }
  </script>
</body>
</html>
