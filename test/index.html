    function getQueryParam(key) {
      const urlParams = new URLSearchParams(window.location.search);
      let val = urlParams.get(key);
      if (val) return val;

      const liffState = urlParams.get('liff.state');
      if (liffState) {
        // URLSearchParams has already decoded liff.state once.
        const decodedState = liffState;
        const stateQueryIndex = decodedState.indexOf('?');
        if (stateQueryIndex !== -1) {
          const stateParams = new URLSearchParams(decodedState.substring(stateQueryIndex));
          val = stateParams.get(key);
          if (val) return val;
        }
      }

      if (window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        val = hashParams.get(key);
        if (val) return val;
      }

      return null;
    }

    // ★ Today Viewerを開くたびに1ノードをランダム選択
    // ★ URL_TODAY_VIEWERSの件数が増減しても、この関数は変更不要
    function getRequestedViewerIndex() {
      const viewer = String(getQueryParam('viewer') || '').trim().toUpperCase();
      const map = { A: 0, B: 1, C: 2, D: 3, E: 4 };
      return Object.prototype.hasOwnProperty.call(map, viewer) ? map[viewer] : -1;

    function chooseTodayViewerUrl() {
      if (URL_TODAY_VIEWERS.length === 1) {
        return URL_TODAY_VIEWERS[0];
      }

      const range = 0x100000000;
      const limit = Math.floor(range / URL_TODAY_VIEWERS.length) * URL_TODAY_VIEWERS.length;
      const randomValue = new Uint32Array(1);

      do {
        crypto.getRandomValues(randomValue);
      } while (randomValue[0] >= limit);

      return URL_TODAY_VIEWERS[randomValue[0] % URL_TODAY_VIEWERS.length];
    }

    const appType = getQueryParam('app');

          const list=document.createElement('dl');

            ['liffInitMs','LIFF初期化：init呼び出し → 完了'],
            ['iframeAddedMs','iframe追加：入口処理開始 → 要素追加直前'],
            ['iframeLoadMs','iframe load：要素追加直前 → 初回load'],
            ['iframeReadyMs','接続準備：要素追加直前 → 初回の検証済みready'],
            ['totalMs','入口経過：入口処理開始 → 初回の検証済みready']
          ];
          labels.forEach(function(row){
            const dt=document.createElement('dt');dt.textContent=row[1];list.append(dt);

          ].forEach(function(text){const p=document.createElement('p');p.textContent=text;panel.append(p);});

        show('liffInitMs',t.liffEnded,t.liffStarted);

        show('iframeReadyMs',t.ready,t.iframeAdded);

    }
    function npsTestNow_(){
      try { const n=performance.now(); return Number.isFinite(n)?n:null; }

    }
    function npsTestLoader_(visible){

    function npsSendCredential_(){
      const receiver=npsPendingReceiver_;
      if(!receiver||!npsReceiverBelongsToViewer_(receiver.source))return;
      receiver.source.postMessage({type:'nps-gateway-context-v2',challenge:receiver.challenge},receiver.origin);
      if(!npsLineCredential_)return;
      receiver.source.postMessage({type:'nps-line-credential-v2',challenge:receiver.challenge,accessToken:npsLineCredential_},receiver.origin);

    });

        const url=new URL(URL_TEST_VIEWER),meal=String(getQueryParam('meal')||'').toUpperCase();
        if(meal==='L'||meal==='D')url.searchParams.set('meal',meal);
        npsViewerFrame_=document.createElement('iframe');npsViewerFrame_.title='Viewer X 検証用';

        npsTestTiming_.liffStarted=npsTestNow_();

          let previous;
          try { previous = Number(sessionStorage.getItem(loginKey) || 0); }
          catch (e) { throw new Error('ログインの繰り返しを防止できません。ブラウザの保存設定をご確認ください。'); }
          if (previous && Date.now() - previous < 300000) {
            throw new Error('LINEログインを完了できませんでした。自動再試行を停止しました。5分後に検証用URLを開き直してください。');
          }
          try { sessionStorage.setItem(loginKey, String(Date.now())); }
          catch (e) { throw new Error('ログイン状態を保存できません。ブラウザの保存設定をご確認ください。'); }
          liff.login({redirectUri:returnUrl.href});
          return;
        }
        try { sessionStorage.removeItem(loginKey); } catch (e) {}
        const credential=liff.getAccessToken();
        if(!credential)throw new Error('LINE認証情報を取得できませんでした。LINEから開き直してください');
        npsLineCredential_=credential;
        const url=new URL(baseUrl);
        const meal=String(getQueryParam('meal')||'').toUpperCase();
        const target=getQueryParam('target')||'';
        if(meal==='L'||meal==='D')url.searchParams.set('meal',meal);
        if(target)url.searchParams.set('target',target);
        npsTestLoader_(true);
        npsViewerFrame_=document.createElement('iframe');
        npsViewerFrame_.title='日次レポートビューアー';
        npsViewerFrame_.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;background:white;z-index:5';
        npsViewerFrame_.referrerPolicy='no-referrer';
        npsViewerFrame_.allow='camera; fullscreen';
        npsViewerFrame_.src=url.href;
        npsViewerFrame_.addEventListener('load',function(){
          const t=npsTestTiming_;
          if(t&&!Object.prototype.hasOwnProperty.call(t,'iframeLoaded')){
            t.iframeLoaded=npsTestNow_();
            npsTestLogTiming_('[LIFF test iframe load timing]');
          }
        });
        npsTestTiming_.iframeAdded=npsTestNow_();
        document.body.append(npsViewerFrame_);
        if(npsTestDiagnostic_)npsTestDiagnosticUpdate_();
        npsXWaitTimer_=setTimeout(function(){
          if(npsPendingReceiver_)return;
          npsLineCredential_='';
          npsXShowStatus_('ビューアーの認証接続を確認できませんでした。\nこの画面を閉じ、LINEから開き直してください。\n確認コード：AB_FRAME_READY_TIMEOUT',false);
        },45000);
      }catch(error){
        npsLineCredential_='';
        if(npsViewerFrame_)npsViewerFrame_.remove();
        npsViewerFrame_=null;
        npsXShowStatus_(error&&error.message||'ビューアーを開けませんでした',false);
      }
    }

    // Isolated test entry: never route a test request to a production viewer.
    const TEST_A_URL = 'https://script.google.com/macros/s/AKfycbzlsw-2kV94RrMRiv1rE1sKTUiu7-0Cff4E5WSPZ3NfWdZE8WrLErjNZl4mGSkfWbE6/exec';
    const TEST_B_URL = 'https://script.google.com/macros/s/AKfycbyX5ib617RgFiOiPl2qeaO29ZsC53utVH-Z_BO0wP9TjinBq1eLexI8Naa2g9uaWivEVA/exec';
    async function main() {
      const viewer=String(getQueryParam('viewer')||'').trim().toUpperCase();
      if(viewer!=='TEST_A'&&viewer!=='TEST_B'){
        npsXShowStatus_('検証用入口です。\nviewer=TEST_A または viewer=TEST_B を指定してください。',false);
        return;
      }
      return npsOpenEmbeddedAB_(viewer==='TEST_A'?TEST_A_URL:TEST_B_URL,viewer);
    }

  </script>
