<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f5">
  <title>Security Maintenance Preview | NPS Viewer</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #333; background: #f6f6f5; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; background: #f6f6f5; }
    .maintenance-page { min-height: 100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:max(30px,env(safe-area-inset-top)) 22px max(30px,env(safe-area-inset-bottom)); text-align:center; }
    .error-code { color:#333; font-size:clamp(76px,20vw,112px); font-weight:700; line-height:1; letter-spacing:-.04em; }
    .error-title { margin-top:24px; color:#333; font-size:clamp(20px,5.3vw,28px); font-weight:500; }
    .error-copy { margin-top:38px; color:#666; font-size:15px; line-height:2.05; }
    .scrim { position:fixed; inset:0; display:grid; place-items:center; padding:22px; background:rgba(15,15,15,.42); }
    .dialog { width:min(100%,430px); padding:25px 24px 20px; border-radius:8px; border:1px solid #d9d9d9; background:#fff; box-shadow:0 10px 34px rgba(0,0,0,.2); text-align:left; animation:appear .18s ease-out both; }
    .dialog h1 { margin:0; padding:0 0 17px; border-bottom:1px solid #ddd; color:#222; font-size:19px; font-weight:700; line-height:1.5; }
    .dialog-copy { margin:17px 0 0; color:#444; font-size:15px; line-height:1.9; }
    .details { margin:18px 0 0; border-top:1px solid #e5e5e5; border-bottom:1px solid #e5e5e5; }
    .details div { display:grid; grid-template-columns:1fr auto; gap:14px; padding:12px 2px; align-items:baseline; }
    .details dt { color:#666; font-size:13px; }
    .details dd { margin:0; color:#222; font-size:14px; font-weight:600; }
    .wait-copy { margin:16px 0 0; color:#555; font-size:14px; line-height:1.8; }
    button { display:block; width:100%; min-height:48px; margin-top:21px; border:1px solid #aaa; border-radius:5px; background:#f7f7f7; color:#222; font:inherit; font-size:15px; font-weight:600; cursor:pointer; }
    button:focus-visible { outline:3px solid #777; outline-offset:3px; }
    body.dismissed .scrim { display:none; }
    @keyframes appear { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
    @media(prefers-reduced-motion:reduce){.dialog{animation:none}}
  </style>
</head>
<body>
  <main class="maintenance-page" aria-label="503 Service Unavailable">
    <div class="error-code">503</div>
    <div class="error-title">Service Unavailable</div>
    <p class="error-copy">ただいまメンテナンス中です。<br>時間をおいて、再度アクセスしてください。</p>
  </main>
  <div class="scrim">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="notice-title" aria-describedby="notice-copy">
      <h1 id="notice-title">セキュリティメンテナンスのお知らせ</h1>
      <p id="notice-copy" class="dialog-copy">現在、システムの安全性確認および保守作業のため、<br>一時的にサービスを停止しております。</p>
      <dl class="details">
        <div><dt>メンテナンス終了時期</dt><dd>未定</dd></div>
      </dl>
      <p class="wait-copy">再開まで今しばらくお待ちください。</p>
      <button type="button" id="dismiss">確認しました</button>
    </section>
  </div>
  <script>
    document.getElementById('dismiss').addEventListener('click', function () {
      document.body.classList.add('dismissed');
    });
  </script>
</body>
</html>
